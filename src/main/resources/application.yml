# server port
server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 1234

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  jpa:
     hibernate:
      # Entity와 기존 DB 테이블 구조가 일치하는지 검사한다.
      ddl-auto: validate
    # DB 작업은 Service의 트랜잭션 범위에서 처리한다.
     open-in-view: false


# MyBatis 학습 기록: DB 접근을 JPA로 전환하여 기존 매퍼 설정을 비활성화한다.
# XML 원문은 .xml.txt 확장자로 보관한다.
# mybatis:
#   mapper-locations: classpath:mapper/*.xml
#   config-location: classpath:mybatis-config.xml
