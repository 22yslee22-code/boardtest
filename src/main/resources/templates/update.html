<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>글 수정</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<main class="container">
    <section class="board-card">

        <form th:action="@{|/update/${board.id}|}"
              method="post"
              name="updateForm"
              class="write-form">

            <input type="hidden"
                   name="id"
                   th:value="${board.id}">

            <!-- 제목 -->
            <div class="form-group">
                <label for="boardTitle">제목</label>
                <input type="text"
                       id="boardTitle"
                       name="boardTitle"
                       th:value="${board.boardTitle}"
                       required>
            </div>

            <div class="form-row">

                <!-- 작성자 (수정 불가) -->
                <div class="form-group">
                    <label for="boardWriter">작성자</label>
                    <input type="text"
                           id="boardWriter"
                           name="boardWriter"
                           th:value="${board.boardWriter}"
                           readonly>
                </div>


                <!-- 비밀번호 -->
<!--                <div class="form-group">
                    <label for="board-pass">비밀번호 확인</label>
                    <input type="password"
                           id="board-pass"
                           name="boardPass"
                           placeholder="비밀번호를 입력해 주세요"
                           autocomplete="off"
                           required>
                </div>-->

            </div>

            <!-- 내용 -->
            <div class="form-group">
                <label for="boardContents">내용</label>
                <textarea id="boardContents"
                          name="boardContents"
                          rows="10"
                          th:text="${board.boardContents}"
                          required></textarea>
            </div>

            <!-- 하단 버튼 -->
            <div class="form-actions">
                <a th:href="@{|/${board.id}|}"
                   class="home-btn">
                    ← 취소
                </a>

                <button type="submit" class="write-btn">
                    수정 완료
                </button>
                <!--<button type="button"
                        class="write-btn"
                        onclick="board_update()">
                    수정 완료
                </button>-->
            </div>

        </form>

    </section>

            updateForm.submit();
        } else {
            alert("비밀번호가 틀립니다!!");
        }
    }
</script>-->

</main>
</html>
